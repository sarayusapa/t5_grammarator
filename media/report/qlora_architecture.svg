<svg viewBox="0 20 900 200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="240" fill="#0a0a0a"/>

  <defs>
    <pattern id="quantBlocks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0a0a0a"/>
      <rect width="18" height="18" fill="#1d4ed8" fill-opacity="0.55"/>
      <rect x="20" y="20" width="18" height="18" fill="#1d4ed8" fill-opacity="0.55"/>
      <rect x="20" width="18" height="18" fill="#1d4ed8" fill-opacity="0.25"/>
      <rect y="20" width="18" height="18" fill="#1d4ed8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Wq (frozen, quantized) -->
  <rect x="50" y="40" width="160" height="160" fill="url(#quantBlocks)" stroke="#3b82f6" stroke-width="2.5" rx="6"/>
  <text x="130" y="128" font-size="20" text-anchor="middle" fill="#60a5fa" font-weight="bold">W_q</text>

  <text x="240" y="122" font-size="20" text-anchor="middle" fill="#cbd5e1">→</text>

  <!-- dequantized W (still frozen, full precision) -->
  <rect x="270" y="40" width="120" height="160" fill="none" stroke="#3b82f6" stroke-width="2.5" rx="6"/>
  <text x="330" y="128" font-size="18" text-anchor="middle" fill="#60a5fa">W</text>

  <text x="425" y="130" font-size="26" text-anchor="middle" fill="#f5f5f5">+</text>

  <!-- B -->
  <rect x="455" y="40" width="32" height="160" fill="none" stroke="#22c55e" stroke-width="2.5" rx="4"/>
  <text x="471" y="125" font-size="15" text-anchor="middle" fill="#4ade80">B</text>

  <text x="505" y="130" font-size="18" text-anchor="middle" fill="#f5f5f5">×</text>

  <!-- A -->
  <rect x="525" y="102" width="140" height="36" fill="none" stroke="#22c55e" stroke-width="2.5" rx="4"/>
  <text x="595" y="126" font-size="15" text-anchor="middle" fill="#4ade80">A</text>

  <text x="710" y="130" font-size="26" text-anchor="middle" fill="#f5f5f5">=</text>

  <!-- Result -->
  <rect x="745" y="40" width="120" height="160" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5" rx="6"/>
  <text x="805" y="125" font-size="18" text-anchor="middle" fill="#60a5fa">W′</text>
</svg>
