<svg viewBox="0 20 900 200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="240" fill="#0a0a0a"/>

  <!-- W (frozen) -->
  <rect x="50" y="40" width="160" height="160" fill="none" stroke="#3b82f6" stroke-width="2.5" rx="6"/>
  <text x="130" y="130" font-size="26" text-anchor="middle" fill="#60a5fa">W</text>

  <text x="245" y="130" font-size="30" text-anchor="middle" fill="#f5f5f5">+</text>

  <!-- B (trainable, tall thin) -->
  <rect x="285" y="40" width="36" height="160" fill="none" stroke="#22c55e" stroke-width="2.5" rx="4"/>
  <text x="303" y="125" font-size="16" text-anchor="middle" fill="#4ade80">B</text>

  <text x="345" y="130" font-size="22" text-anchor="middle" fill="#f5f5f5">×</text>

  <!-- A (trainable, short wide) -->
  <rect x="370" y="102" width="160" height="36" fill="none" stroke="#22c55e" stroke-width="2.5" rx="4"/>
  <text x="450" y="126" font-size="16" text-anchor="middle" fill="#4ade80">A</text>

  <text x="570" y="130" font-size="30" text-anchor="middle" fill="#f5f5f5">=</text>

  <!-- W' result -->
  <rect x="605" y="40" width="160" height="160" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5" rx="6"/>
  <text x="685" y="130" font-size="24" text-anchor="middle" fill="#60a5fa">W′</text>
</svg>
